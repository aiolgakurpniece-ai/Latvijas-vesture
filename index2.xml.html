<!doctype html><html lang='lv'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Latvijas vēstures piedzīvojums</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0d1530;color:#fff;min-height:100vh}button{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;background:#0d1530ee;padding:10px 0;z-index:3}.pill{background:#202c55;border-radius:999px;padding:9px 13px;font-weight:800}.card{background:linear-gradient(160deg,#1b2852,#121c3c);border:1px solid #354577;border-radius:24px;padding:22px;box-shadow:0 15px 40px #0005;margin-top:12px}.scene{min-height:260px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden;position:relative}.scene .emoji{font-size:72px;animation:float 2.3s ease-in-out infinite}.scene h1{font-size:29px;margin:8px 0}.scene p{font-size:18px;line-height:1.5;color:#e1e7ff}.caption{background:#0008;padding:12px;border-radius:14px}.btn{width:100%;border:0;border-radius:16px;padding:15px;margin-top:12px;background:#ffd54a;color:#1b2240;font-weight:900;font-size:17px}.btn.secondary{background:#2b396c;color:white}.answers{display:grid;gap:10px;margin-top:15px}.ans{border:1px solid #4a5b94;background:#202d59;color:white;padding:14px;border-radius:14px;text-align:left;font-weight:700}.ans.good{background:#176b48}.ans.bad{background:#7b2c3a}.small{font-size:14px;color:#aeb9df}.progress{height:9px;background:#26345f;border-radius:20px;overflow:hidden}.bar{height:100%;background:#ffd54a;transition:.4s}.award{font-size:80px;text-align:center}.hidden{display:none}@keyframes float{50%{transform:translateY(-10px)}}@keyframes enter{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:none}}.animate{animation:enter .45s ease}.timeline{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}.date{background:#283763;border-radius:12px;padding:8px;font-size:13px}.fact{border-left:4px solid #ffd54a;padding-left:12px;text-align:left}.speaker{font-size:13px;color:#ffd54a;font-weight:900;letter-spacing:.08em}.result{font-size:24px;font-weight:900;text-align:center}.confetti{font-size:35px;letter-spacing:8px;text-align:center}</style></head><body><div class='app'><div class='top'><div class='pill'>❤️ <span id='lives'>3</span></div><div class='pill'>⭐ <span id='score'>0</span></div><div class='pill'>Misija <span id='level'>1</span>/6</div></div><div class='progress'><div id='bar' class='bar'></div></div><main id='screen'></main></div><script>
const scenes=[
{emoji:'🕵️‍♀️🗺️',title:'Slepenā vienošanās',speaker:'1939. GADS',text:'1939. gada 23. augustā Padomju Savienība un Vācija noslēdza neuzbrukšanas līgumu — Molotova–Ribentropa paktu. Slepenais protokols sadalīja ietekmes sfēras, un Latvija nonāca PSRS interešu lokā.',q:'Kā sauca 1939. gada 23. augusta līgumu?',a:['Molotova–Ribentropa pakts','Satversme','Versaļas līgums'],ok:0,why:'Pareizi! Slepenais protokols pie Molotova–Ribentropa pakta iekļāva Latviju PSRS interešu lokā.'},
{emoji:'🚧🇱🇻',title:'Latvija tiek okupēta',speaker:'1940. GADA JŪNIJS',text:'1940. gada jūnijā Padomju Savienība okupēja Latviju. Okupācija nozīmē citas valsts teritorijas sagrābšanu ar bruņotu spēku un savas pārvaldības ieviešanu.',q:'Ko nozīmē “okupācija”?',a:['Teritorijas sagrābšanu un savas pārvaldības ieviešanu','Brīvas vēlēšanas','Valstu draudzības līgumu'],ok:0,why:'Jā! Okupācija ir teritorijas sagrābšana ar bruņotu spēku un savas pārvaldības ieviešana.'},
{emoji:'🚂🧳',title:'Deportācijas',speaker:'1941. UN 1949. GADS',text:'1941. gada 14. jūnijā un 1949. gada 25. martā notika plašas deportācijas. Cilvēkiem lika ātri pamest mājas, viņus nogādāja stacijās un ar vilcieniem izsūtīja uz tāliem PSRS apgabaliem.',q:'Kuri datumi saistīti ar lielajām deportācijām?',a:['14.06.1941. un 25.03.1949.','18.11.1918. un 04.05.1990.','01.01.1940. un 31.12.1949.'],ok:0,why:'Tieši tā. Šie divi datumi ir īpaši svarīgi, apgūstot padomju represijas Latvijā.'},
{emoji:'👁️📻',title:'Kontrole un Čeka',speaker:'PADOMJU OKUPĀCIJAS LAIKS',text:'Sabiedrību kontrolēja valsts iestādes. No 1954. gada Valsts Drošības komiteja — VDK — veica plašu sabiedrības kontroli. Represiju iestādes mēdza saukt par Čeku, bet darbiniekus — par čekistiem.',q:'Ko nozīmē saīsinājums VDK?',a:['Valsts Drošības komiteja','Valsts Demokrātijas komanda','Vispārējā Darba komisija'],ok:0,why:'Pareizi — Valsts Drošības komiteja.'},
{emoji:'📺🏭🛒',title:'Ikdiena LPSR',speaker:'DZĪVE PADOMJU SISTĒMĀ',text:'Presi, radio, televīziju un mācību saturu kontrolēja. Tika uzspiesta padomju ideoloģija un krievu valoda. Saimniecību vadīja pēc PSRS plāniem, un cilvēkiem bieži trūka ikdienas preču — veidojās garas rindas.',q:'Kura parādība bija raksturīga padomju saimniecībai?',a:['Preču trūkums un rindas','Pilnīgi brīvs tirgus','Nekontrolēta prese'],ok:0,why:'Pareizi! Plānveida saimniecība bieži nenodrošināja cilvēkiem nepieciešamās preces.'},
{emoji:'📜🌍🇱🇻',title:'Latvijas valsts nepazuda',speaker:'SVARĪGA DOMA',text:'Lai gan Latvijas teritorija bija okupēta, Latvijas Republika turpināja pastāvēt kā starptautisko tiesību subjekts. Daudzas valstis okupāciju neatzina par likumīgu, un Latvijas diplomāti ārzemēs turpināja aizstāvēt valsts intereses.',q:'Vai Latvijas Republika juridiski pilnībā pārstāja pastāvēt?',a:['Nē — tā turpināja pastāvēt kā starptautisko tiesību subjekts','Jā — tā pilnībā pazuda','Tikai līdz 1954. gadam'],ok:0,why:'Lieliski! Šī ir viena no svarīgākajām tēmas atziņām.'}
];
let i=0,score=0,lives=3,mode='story';const s=document.getElementById('screen');
function hud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('level').textContent=Math.min(i+1,6);document.getElementById('bar').style.width=((i+(mode==='quiz'?0.55:0))/6*100)+'%'}
function story(){mode='story';hud();let x=scenes[i];s.innerHTML=`<section class="card scene animate"><div class="speaker">${x.speaker}</div><div class="emoji">${x.emoji}</div><h1>${x.title}</h1><div class="caption"><p>${x.text}</p></div><button class="btn" onclick="quiz()">🎮 Esmu gatavs uzdevumam</button><p class="small">Izlasi vai noklausies tekstu sev skaļi. Tad pārbaudi, ko atceries.</p></section>`}
function quiz(){mode='quiz';hud();let x=scenes[i];s.innerHTML=`<section class="card animate"><div class="speaker">MINI MISIJA ${i+1}</div><h1>${x.q}</h1><div class="answers">${x.a.map((v,j)=>`<button class="ans" onclick="answer(${j},this)">${String.fromCharCode(65+j)}) ${v}</button>`).join('')}</div><div id="feedback"></div></section>`}
function answer(j,b){document.querySelectorAll('.ans').forEach(z=>z.disabled=true);let x=scenes[i],f=document.getElementById('feedback');if(j===x.ok){score+=100;b.classList.add('good');f.innerHTML=`<div class="card"><b>⭐ +100! Pareizi!</b><p>${x.why}</p><button class="btn" onclick="next()">Tālāk ➜</button></div>`}else{lives=Math.max(0,lives-1);b.classList.add('bad');document.querySelectorAll('.ans')[x.ok].classList.add('good');f.innerHTML=`<div class="card"><b>Gandrīz!</b><p>${x.why}</p><button class="btn" onclick="next()">Turpināt ➜</button></div>`}hud()}
function next(){i++;if(i<scenes.length)story();else finalBoss()}
function finalBoss(){mode='boss';document.getElementById('bar').style.width='100%';s.innerHTML=`<section class="card scene animate"><div class="emoji">👑⚔️</div><h1>FINĀLA BOSS</h1><p>Saliec notikumus pareizā secībā!</p><div class="timeline"><span class="date">A — 1949. deportācija</span><span class="date">B — Molotova–Ribentropa pakts</span><span class="date">C — Latvijas okupācija</span><span class="date">D — 1941. deportācija</span></div><p><b>Kura secība ir pareiza?</b></p><div class="answers"><button class="ans" onclick="finish(false)">A → B → C → D</button><button class="ans" onclick="finish(true)">B → C → D → A</button><button class="ans" onclick="finish(false)">C → B → A → D</button></div></section>`}
function finish(ok){if(ok)score+=300;else lives=Math.max(0,lives-1);hud();let max=900,p=Math.round(score/max*100);s.innerHTML=`<section class="card animate"><div class="confetti">🎉 ⭐ 🎉</div><div class="award">🏆</div><h1 class="result">Misija pabeigta!</h1><p class="result">${score} punkti · ${p}%</p><p class="fact"><b>Tu tagad zini:</b> kā sākās Latvijas okupācija, kas bija deportācijas, kā darbojās padomju kontrole un kāpēc Latvijas Republika juridiski nepazuda.</p><button class="btn" onclick="i=0;score=0;lives=3;story()">🔄 Spēlēt vēlreiz</button></section>`}
story();
</script></body></html>
